<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Rede Especialistas
    </title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- ======================================
         FUNDO
    ======================================= -->

    <div class="background"></div>


    <!-- ======================================
         CONTAINER LOGIN
    ======================================= -->

    <main class="login-container">


        <!-- CARD -->

        <section class="login-card">


            <!-- LOGO / ÍCONE -->

            <div class="logo-area">

                <div class="logo-icon">
                    🦷
                </div>

                <h1>
                    Rede Especialistas
                </h1>

                <p>
                    Painel Administrativo
                </p>

            </div>


            <!-- DIVISOR -->

            <div class="divider"></div>


            <!-- TÍTULO -->

            <div class="login-header">

                <h2>
                    Bem-vindo
                </h2>

                <p>
                    Faça login para acessar o painel administrativo.
                </p>

            </div>


            <!-- FORMULÁRIO -->

            <form id="formLogin">


                <!-- USUÁRIO -->

                <div class="campo">

                    <label for="usuarioLogin">
                        Usuário
                    </label>

                    <div class="input-container">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="usuarioLogin"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="campo">

                    <label for="senhaLogin">
                        Senha
                    </label>

                    <div class="input-container">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="senhaLogin"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <!-- MENSAGEM -->

                <div
                    id="mensagemLogin"
                    class="mensagem-login"
                ></div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn-login"
                >

                    <span>
                        Entrar no Painel
                    </span>

                    <span class="btn-arrow">
                        →
                    </span>

                </button>


            </form>


            <!-- RODAPÉ -->

            <div class="login-footer">

                <p>
                    🔐 Área restrita para administradores
                </p>

            </div>


        </section>


        <!-- TEXTO INFERIOR -->

        <div class="copyright">

            © 2026 Rede Especialistas

        </div>


    </main>


    <!-- ======================================
         JAVASCRIPT
    ======================================= -->

    <script src="js/login.js"></script>


</body>

</html>
