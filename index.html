<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rede Especialistas</title>

    <link
        rel="icon"
        type="image/png"
        href="img/tooth.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- =========================================================
         CABEÇALHO
    ========================================================== -->

    <header class="header">

        <div class="header-left">

            <img
                src="img/tooth.png"
                alt="Logo Rede Especialistas"
                class="logo"
            >

            <div class="titulo-site">
                <h1>Rede Especialistas</h1>
                <p>Encontre clínicas e especialistas</p>
            </div>

        </div>


        <!-- =====================================================
             MENU SUPERIOR
        ====================================================== -->

        <nav class="menu-topo">

            <a
                href="index.html"
                class="menu-link ativo"
            >
                🦷 Rede Especialistas
            </a>

            <a
                href="sindilegis.html"
                class="menu-link"
            >
                🏥 Sindilegis
            </a>

            <button
                type="button"
                id="btnTema"
                class="btn-tema"
                title="Ativar tema escuro"
                aria-label="Alternar tema"
            >
                🌙
            </button>

            <a
                href="login.html"
                class="menu-link login-link"
            >
                🔐 Login
            </a>

        </nav>

    </header>


    <!-- =========================================================
         CONTEÚDO PRINCIPAL
    ========================================================== -->

    <main class="container">

        <!-- =====================================================
             TÍTULO
        ====================================================== -->

        <section class="titulo-principal">

            <h2>
                Encontre uma clínica
            </h2>

            <p>
                Pesquise por localização e especialidade.
            </p>

        </section>


        <!-- =====================================================
             FILTROS
        ====================================================== -->

        <section class="filtros">

            <!-- Região -->

            <div class="filtro">

                <label for="regiao">
                    Região
                </label>

                <select id="regiao">

                    <option value="">
                        Selecione a Região
                    </option>

                </select>

            </div>


            <!-- Estado -->

            <div class="filtro">

                <label for="estado">
                    Estado
                </label>

                <select id="estado">

                    <option value="">
                        Selecione o Estado
                    </option>

                </select>

            </div>


            <!-- Cidade -->

            <div class="filtro">

                <label for="cidade">
                    Cidade
                </label>

                <select id="cidade">

                    <option value="">
                        Selecione a Cidade
                    </option>

                </select>

            </div>


            <!-- Bairro -->

            <div class="filtro">

                <label for="bairro">
                    Bairro
                </label>

                <select id="bairro">

                    <option value="">
                        Selecione o Bairro
                    </option>

                </select>

            </div>


            <!-- Especialidade -->

            <div class="filtro">

                <label for="especialidade">
                    Especialidade
                </label>

                <select id="especialidade">

                    <option value="">
                        Todas as Especialidades
                    </option>

                </select>

            </div>


            <!-- Botão pesquisar -->

            <div class="filtro filtro-botao">

                <button
                    type="button"
                    id="buscar"
                    class="btn-buscar"
                >
                    🔎 Buscar Clínicas
                </button>

            </div>

        </section>


        <!-- =====================================================
             RESULTADOS
        ====================================================== -->

        <section
            id="resultado"
            aria-live="polite"
        >

            <div class="semResultado">

                <h2>
                    Encontre uma clínica
                </h2>

                <p>
                    Selecione os filtros desejados e clique em
                    <strong>Buscar Clínicas</strong>.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================================================
         SCRIPTS
         
         IMPORTANTE:
         A ordem desses arquivos é importante.
    ========================================================== -->

    <!-- Biblioteca Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Configuração do Supabase -->
    <script src="js/supabase.js"></script>


    <!-- Tema claro/escuro -->
    <script src="js/tema.js"></script>


    <!-- Filtros de localização e especialidade -->
    <script src="js/filtros.js"></script>


    <!-- Montagem dos cards das clínicas -->
    <script src="js/cards.js"></script>


    <!-- Busca da Rede Especialistas -->
    <script src="js/especialistas.js"></script>

</body>

</html>
