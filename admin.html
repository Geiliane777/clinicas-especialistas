<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="format-detection"
        content="telephone=no"
    >

    <title>
        Login | Painel Administrativo
    </title>


    <!-- ÍCONE DA ABA -->

    <link
        rel="icon"
        href="img/tooth.png"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- ======================================
         FUNDO DECORATIVO
    ======================================= -->

    <div class="background">

        <div class="bola bola1"></div>

        <div class="bola bola2"></div>

        <div class="bola bola3"></div>

    </div>


    <!-- ======================================
         CONTAINER LOGIN
    ======================================= -->

    <main class="login-container">


        <section class="login-card">


            <!-- ======================================
                 LOGO
            ======================================= -->

            <div class="logo-container">

                <img
                    src="img/tooth.png"
                    alt="Logo Rede Especialistas"
                    class="login-logo"
                >

            </div>


            <!-- ======================================
                 TÍTULO
            ======================================= -->

            <h1>
                Painel Administrativo
            </h1>


            <p class="login-subtitulo">

                Gerencie clínicas, especialidades
                e localidades da Rede Especialistas.

            </p>


            <!-- LINHA DECORATIVA -->

            <div class="linha"></div>


            <!-- ======================================
                 FORMULÁRIO
            ======================================= -->

            <form id="formLogin">


                <!-- USUÁRIO -->

                <div class="campo-login">

                    <label for="usuarioLogin">

                        Usuário

                    </label>


                    <div class="input-container">

                        <span class="icone-input">
                            👤
                        </span>


                        <input
                            type="text"
                            id="usuarioLogin"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="campo-login">

                    <label for="senhaLogin">

                        Senha

                    </label>


                    <div class="input-container">

                        <span class="icone-input">
                            🔒
                        </span>


                        <input
                            type="password"
                            id="senhaLogin"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <!-- MENSAGEM -->

                <div
                    id="mensagemLogin"
                    class="mensagem-login"
                ></div>


                <!-- BOTÃO LOGIN -->

                <button
                    type="submit"
                    class="btn-login"
                >

                    <span>
                        Entrar no Painel
                    </span>

                    <span class="seta">
                        →
                    </span>

                </button>


                <!-- BOTÃO VOLTAR -->

                <button
                    type="button"
                    class="btn-voltar"
                    onclick="voltarParaSite()"
                >

                    ← Voltar para Rede Especialistas

                </button>


            </form>


            <!-- ======================================
                 RODAPÉ
            ======================================= -->

            <div class="login-footer">

                <span>
                    🦷
                </span>

                Sistema de gerenciamento

            </div>


        </section>


    </main>


    <!-- ======================================
         JAVASCRIPT
    ======================================= -->

    <script src="js/login.js"></script>


</body>

</html>
