<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rede Sindilegis</title>

    <link rel="icon" type="image/png" href="img/tooth.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="sindilegis">

    <!-- =========================================================
         CABEÇALHO
    ========================================================== -->

    <header class="header">

        <div class="header-left">

            <img
                src="img/tooth.png"
                alt="Logo Rede Sindilegis"
                class="logo"
            >

            <div class="titulo-site">
                <h1>Rede Sindilegis</h1>
                <p>Encontre clínicas credenciadas</p>
            </div>

        </div>


        <!-- MENU SUPERIOR -->

        <nav class="menu-topo">

            <a
                href="index.html"
                class="menu-link"
            >
                🦷 Rede Especialistas
            </a>

            <a
                href="sindilegis.html"
                class="menu-link ativo"
            >
                🏥 Sindilegis
            </a>

            <button
                type="button"
                id="btnTema"
                class="btn-tema"
                title="Ativar tema escuro"
                aria-label="Alternar tema"
            >
                🌙
            </button>

            <a
                href="login.html"
                class="menu-link login-link"
            >
                🔐 Login
            </a>

        </nav>

    </header>


    <!-- =========================================================
         CONTEÚDO PRINCIPAL
    ========================================================== -->

    <main class="container">


        <!-- =====================================================
             TÍTULO
        ====================================================== -->

        <section class="titulo-principal">

            <h2>Encontre uma clínica</h2>

            <p>
                Pesquise por localização e especialidade.
            </p>

        </section>


        <!-- =====================================================
             FILTROS
        ====================================================== -->

        <section class="filtros">

            <!-- REGIÃO -->

            <div class="filtro">

                <label for="regiao">
                    Região
                </label>

                <select id="regiao">
                    <option value="">
                        Selecione a Região
                    </option>
                </select>

            </div>


            <!-- ESTADO -->

            <div class="filtro">

                <label for="estado">
                    Estado
                </label>

                <select id="estado" disabled>
                    <option value="">
                        Selecione o Estado
                    </option>
                </select>

            </div>


            <!-- CIDADE -->

            <div class="filtro">

                <label for="cidade">
                    Cidade
                </label>

                <select id="cidade" disabled>
                    <option value="">
                        Selecione a Cidade
                    </option>
                </select>

            </div>


            <!-- BAIRRO -->

            <div class="filtro">

                <label for="bairro">
                    Bairro
                </label>

                <select id="bairro" disabled>
                    <option value="">
                        Selecione o Bairro
                    </option>
                </select>

            </div>


            <!-- ESPECIALIDADE -->

            <div class="filtro">

                <label for="especialidade">
                    Especialidade
                </label>

                <select id="especialidade">

                    <option value="">
                        Todas as Especialidades
                    </option>

                </select>

            </div>


            <!-- BOTÃO -->

            <div class="filtro filtro-botao">

                <button
                    type="button"
                    id="buscar"
                    class="btn-buscar"
                >
                    🔎 Buscar Clínicas
                </button>

            </div>

        </section>


        <!-- =====================================================
             RESULTADOS
        ====================================================== -->

        <section
            id="resultado"
            aria-live="polite"
        >

            <div class="semResultado">

                <div class="semResultado-icone">
                    🏥
                </div>

                <h2>
                    Encontre uma clínica
                </h2>

                <p>
                    Selecione os filtros desejados e clique em
                    <strong>Buscar Clínicas</strong>.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================================================
         SCRIPTS
    ========================================================== -->

    <!-- Supabase -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Configuração Supabase -->

    <script src="js/supabase.js"></script>


    <!-- Tema -->

    <script src="js/tema.js"></script>


    <!-- Filtros -->

    <script src="js/filtros.js"></script>


    <!-- Cards -->

    <script src="js/cards.js"></script>


    <!-- Rede Sindilegis -->

    <script src="js/sindilegis.js"></script>

</body>

</html>
